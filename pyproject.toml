[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["server", "client"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["server/riskapp_server", "client/riskapp_client"]
omit = [
  "client/riskapp_client/ui_v2/ui/ui_*.py",
]

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]
init-hook = "import sys; sys.path[:0] = ['client', 'server']"
source-roots = ["client", "server"]

[tool.pyright]
extraPaths = ["server", "client"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
(
  /\.venv
  | /\.git
  | /__pycache__
  | /ui_[^/]*\.py$
)
'''

[tool.mypy]
python_version = "3.11"
mypy_path = ["server", "client"]
files = [
  "server/riskapp_server/api/routers/actions.py",
  "server/riskapp_server/api/routers/auth_routes.py",
  "server/riskapp_server/api/routers/crud_factory.py",
  "server/riskapp_server/api/routers/helpdesk.py",
  "server/riskapp_server/api/routers/matrix.py",
  "server/riskapp_server/api/routers/opportunities.py",
  "server/riskapp_server/api/routers/projects.py",
  "server/riskapp_server/api/routers/risks.py",
  "server/riskapp_server/api/routers/snapshots.py",
  "server/riskapp_server/api/routers/sync_routes.py",
  "server/riskapp_server/api/routers/users.py",
  "server/riskapp_server/auth/passwords.py",
  "server/riskapp_server/auth/service.py",
  "server/riskapp_server/core/config.py",
  "server/riskapp_server/core/csv_export.py",
  "server/riskapp_server/core/filters.py",
  "server/riskapp_server/core/items_crud.py",
  "server/riskapp_server/core/logging_config.py",
  "server/riskapp_server/core/password_policy.py",
  "server/riskapp_server/core/permissions.py",
  "server/riskapp_server/core/rate_limit.py",
  "server/riskapp_server/core/scoring.py",
  "server/riskapp_server/db/session.py",
  "server/riskapp_server/main/app.py",
  "server/riskapp_server/main/http_middleware.py",
  "server/riskapp_server/main/https_only_middleware.py",
  "server/riskapp_server/schemas/models.py",
  "server/riskapp_server/sync/engine.py",
  "client/riskapp_client/adapters/export/csv_data_exporter.py",
  "client/riskapp_client/adapters/local_storage/schema.py",
  "client/riskapp_client/adapters/local_storage/sqlite_data_store.py",
  "client/riskapp_client/adapters/local_storage/sync_outbox_queue.py",
  "client/riskapp_client/adapters/mappers/action_assessment_mapper.py",
  "client/riskapp_client/adapters/mappers/scored_entity_mapper.py",
  "client/riskapp_client/adapters/remote_api/rest_api_client.py",
  "client/riskapp_client/domain/domain_models.py",
  "client/riskapp_client/domain/scored_entity_fields.py",
  "client/riskapp_client/services/action_management_service.py",
  "client/riskapp_client/services/assessment_management_service.py",
  "client/riskapp_client/services/entity_filters.py",
  "client/riskapp_client/services/helpdesk_service.py",
  "client/riskapp_client/services/member_management_service.py",
  "client/riskapp_client/services/offline_first_facade.py",
  "client/riskapp_client/services/scored_entity_management_service.py",
  "client/riskapp_client/services/synchronization_service.py",
  "client/riskapp_client/ui_v2/helpers/scored_entities_ui_helpers.py",
  "client/riskapp_client/ui_v2/mixins/actions_mixin.py",
  "client/riskapp_client/ui_v2/mixins/assessments_mixin.py",
  "client/riskapp_client/ui_v2/mixins/background_jobs_mixin.py",
  "client/riskapp_client/ui_v2/mixins/helpdesk_mixin.py",
  "client/riskapp_client/ui_v2/mixins/matrix_mixin.py",
  "client/riskapp_client/ui_v2/mixins/members_mixin.py",
  "client/riskapp_client/ui_v2/mixins/scored_entity_mixin.py",
  "client/riskapp_client/ui_v2/mixins/top_history_mixin.py",
  "client/riskapp_client/ui_v2/workers/background_jobs.py",
  "client/riskapp_client/ui_v2/window_state.py",
  "client/riskapp_client/utils/logging_config.py",
  "client/riskapp_client/utils/normalize.py",
  "client/riskapp_client/utils/roles.py",
  "client/riskapp_client/utils/urls.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["riskapp_client.ui_v2.ui.*"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".venv",
  ".git",
  "__pycache__",
  "client/riskapp_client/ui_v2/ui/ui_*.py",
]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "SIM", "W", "S",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
  # Tests intentionally use obvious, non-production credential literals.
  "S105",
  "S106",
  "S107",
]
"tests/client/test_gui_behavior_coverage.py" = ["S108"]
"tests/server/test_ops_cli.py" = ["S104"]

"server/riskapp_server/api/routers/**/*.py" = ["B008"]
"server/riskapp_server/auth/service.py" = ["B008"]
