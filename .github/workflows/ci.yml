name: CI

on:
  push:
  pull_request:
  # Trivy's vulnerability data changes even when the code does not.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by every Trivy step in this workflow. On startup Trivy calls
  # check.trivy.dev to announce newer releases, and sends anonymous usage
  # data unless telemetry is disabled. Disabling telemetry alone still makes
  # that call, so the version check is skipped as well: the Trivy release is
  # pinned in each step and bumped by hand, so the notice would change nothing.
  TRIVY_DISABLE_TELEMETRY: "true"
  TRIVY_SKIP_VERSION_CHECK: "true"

# quality ───┐
#            ├──► image: build, start, /health, vulnerability scan
# secrets ───┘
# The image job runs only when both gates pass, so a broken build or a leaked
# secret stops the run before anything is built.

jobs:
  quality:
    name: Quality checks
    # A pull request from this repository is already covered by the push run
    # of its branch; only pull requests from forks need a run of their own.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            client/requirements.txt
            requirements-dev.txt

      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-3 libegl1

      - name: Install headless test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r server/requirements.txt \
            -r client/requirements.txt \
            -r requirements-dev.txt

      - name: Run project checks
        run: bash scripts/check_project.sh

  secrets:
    name: Secret scan
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository for exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  image:
    name: Image build, run and vulnerability scan
    needs: [quality, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build development API image
        id: build_api
        run: docker build --target server -t riskapp-api:ci .

      # This health check uses disposable runtime keys and needs no admin account.
      # Register the keys for log masking before passing them to the container.
      # Published to 127.0.0.1 rather than 0.0.0.0 -- Docker's published-port
      # rules live in nat/PREROUTING and the filter FORWARD chain, so they are
      # not covered by INPUT-chain host firewall rules.
      - name: Start API container
        shell: bash
        run: |
          SECRET_KEY="$(openssl rand -hex 32)"
          TOKEN_HASH_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$TOKEN_HASH_KEY"
          export SECRET_KEY TOKEN_HASH_KEY

          docker run --detach --name riskapp-api \
            --publish 127.0.0.1:8000:8000 \
            --env ENV=development \
            --env SECRET_KEY \
            --env TOKEN_HASH_KEY \
            --env AUTO_CREATE_SCHEMA=1 \
            riskapp-api:ci

      - name: Wait for healthy API
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs riskapp-api
          exit 1

      - name: Stop API container
        if: always()
        run: docker rm --force riskapp-api || true

      # ---- supply-chain scanning -------------------------------------------
      # Trivy inspects the built image: it identifies the OS package manager
      # database (Debian, here) and every installed language dependency, then
      # matches both against public vulnerability feeds. This covers the half
      # of the dependency tree that the Python pins do not -- the base
      # image's own packages.
      #
      # ignore-unfixed is deliberate: Debian slim images always carry some
      # CVEs with no released patch, and failing on those makes the gate
      # permanently red and therefore ignored. The build fails only on issues
      # that can actually be acted on by rebuilding.
      #
      # Dependabot updates the trivy-action commit SHA below. The Trivy release
      # in `version:` is an action input, not an action reference, so Dependabot
      # does not see it; bump it by hand.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          trivyignores: .trivyignore.yaml
          image-ref: riskapp-api:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Report fixable vulnerabilities of every severity, plus image secrets.
      # Unfixed vulnerabilities stay out, as in the gate above: most are
      # Debian base-image CVEs that no rebuild can fix, and they would bury
      # the alerts that can be acted on. The same expiring, package-scoped
      # exceptions apply to both scans. Findings do not fail this reporting
      # pass; scanner and upload errors still fail the job.
      - name: Report fixable image findings to code scanning
        id: trivy_report
        if: always() && steps.build_api.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          trivyignores: .trivyignore.yaml
          image-ref: riskapp-api:ci
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: false
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload SARIF
        # GitHub withholds security-events: write from Dependabot and fork PRs.
        # Keep the blocking table scan above active, but skip only this upload
        # when the event cannot write to code scanning.
        if: >-
          always() &&
          steps.trivy_report.outcome == 'success' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
