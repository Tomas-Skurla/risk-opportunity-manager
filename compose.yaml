services:
  api:
    build:
      context: .
      target: server
    image: riskapp-api:local
    # Use RISKAPP_HOST_ADDR explicitly to bind another host address.
    # Local HTTP development server: publish to loopback by default.
    ports:
      - ${RISKAPP_HOST_ADDR:-127.0.0.1}:${RISKAPP_HOST_PORT:-8000}:8000
    # Generate private values in .env with ./scripts/dev-init.sh.
    # Missing or empty keys stop Compose before it creates the container.
    environment:
      ENV: development
      SECRET_KEY: ${SECRET_KEY:?Run ./scripts/dev-init.sh or supply SECRET_KEY}
      TOKEN_HASH_KEY: ${TOKEN_HASH_KEY:?Run ./scripts/dev-init.sh or supply TOKEN_HASH_KEY}
      # Set both to create the first administrator.
      # They can be omitted after the administrator account exists.
      INITIAL_SUPERUSER_EMAIL: ${INITIAL_SUPERUSER_EMAIL:-}
      INITIAL_SUPERUSER_PASSWORD: ${INITIAL_SUPERUSER_PASSWORD:-}
      DATABASE_URL: sqlite+pysqlite:////data/riskapp.db
      AUTO_CREATE_SCHEMA: "1"
      RISKAPP_HOST: 0.0.0.0
      RISKAPP_PORT: "8000"
      RISKAPP_RELOAD: "0"
    volumes:
      - riskapp-server-data:/data

volumes:
  riskapp-server-data:
